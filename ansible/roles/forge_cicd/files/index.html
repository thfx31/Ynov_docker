<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Logicielle CI/CD</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: #f2f2f2;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .buttons {
      display: flex;
      gap: 20px;
    }
    a {
      background: #1e90ff;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #0078e7;
    }
  </style>
</head>
<body>
  <h1>🌌 Forge Logicielle CI/CD</h1>
  <div class="buttons">
    <a href="https://gitea.thfx.fr" target="_blank">🚀 Gitea</a>
    <a href="https://jenkins.thfx.fr" target="_blank">⚙️ Jenkins</a>
  </div>
</body>
</html>
